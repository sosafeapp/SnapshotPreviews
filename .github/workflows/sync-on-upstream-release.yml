# Rebases `ios26-orientation-unknown-fix` onto every new upstream release tag
# (vMAJOR.MINOR.PATCH) and publishes a matching `vX.Y.Z-ios26-fix` tag so the
# downstream SOSAFE-iOS project can pin against an immutable tag. On rebase
# conflict, opens (or dedupes) a GitHub Issue describing the failure.
#
# Triggers: daily off-peak cron + manual dispatch. Tag detection is by polling
# (GitHub Actions cannot subscribe to cross-repo events).

name: Sync patches with upstream releases

on:
  schedule:
    - cron: '30 3 * * 1'  # 03:30 UTC every Monday — off-peak, GitHub honors it
  workflow_dispatch:

concurrency:
  group: sync-upstream
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  UPSTREAM_REPO: getsentry/SnapshotPreviews
  PATCH_BRANCH: ios26-orientation-unknown-fix
  TAG_SUFFIX: ios26-fix
  # Handles pinged in failure-mode issue bodies so the iOS team is notified
  # even though the issue is filed in this fork repo (cross-repo notification
  # via @mention — see SKILL.md "Forked dependency" in sosafeapp/SOSAFE-iOS).
  NOTIFY_HANDLE: '@rcaos @soyjimmysaenz'

jobs:
  sync:
    name: Rebase patches onto new upstream releases
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PATCH_BRANCH }}
          fetch-depth: 0  # full history + tags so rebase can find upstream commits

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream tags
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${UPSTREAM_REPO}"
          git fetch upstream --tags

      - name: Identify new upstream release tags
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          # Upstream release tags: vMAJOR.MINOR.PATCH (no pre-release / no -ios26-fix)
          upstream_tags=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V)
          new_tags=()
          for t in $upstream_tags; do
            if ! git rev-parse --verify "refs/tags/${t}-${TAG_SUFFIX}" >/dev/null 2>&1; then
              new_tags+=("$t")
            fi
          done
          if [ ${#new_tags[@]} -eq 0 ]; then
            echo "No new upstream tags."
            echo "has_new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Found ${#new_tags[@]} new tag(s): ${new_tags[*]}"
          {
            echo "has_new=true"
            echo "new_tags<<EOF"
            printf '%s\n' "${new_tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Rebase patches onto each new tag
        if: steps.discover.outputs.has_new == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAGS: ${{ steps.discover.outputs.new_tags }}
        run: |
          set -euo pipefail

          # Locate an open issue by exact title (returns issue number or empty)
          find_open_issue() {
            local title="$1"
            gh issue list --state open --json number,title \
              --jq ".[] | select(.title == \"${title}\") | .number" | head -1
          }

          # Open a tracking issue, or comment on the existing one (dedup by title)
          report_issue() {
            local title="$1" body_file="$2" labels="${3:-}"
            local existing
            existing=$(find_open_issue "${title}")
            if [ -z "${existing}" ]; then
              if [ -n "${labels}" ]; then
                gh issue create --title "${title}" --body-file "${body_file}" --label "${labels}" || \
                  gh issue create --title "${title}" --body-file "${body_file}"
              else
                gh issue create --title "${title}" --body-file "${body_file}"
              fi
            else
              gh issue comment "${existing}" --body-file "${body_file}"
            fi
          }

          # Iterate oldest -> newest so each rebase builds on the previous
          while IFS= read -r t; do
            [ -z "$t" ] && continue
            echo "::group::Rebasing onto ${t}"

            git checkout "${PATCH_BRANCH}"

            if ! git rebase "${t}"; then
              git rebase --abort || true
              echo "::endgroup::"
              echo "::error::Rebase onto ${t} failed."

              title="Sync conflict: cannot rebase patches onto ${t}"
              body_file="$(mktemp)"
              {
                printf '%s — automated sync needs attention.\n\n' "${NOTIFY_HANDLE}"
                printf 'Automated sync attempted to rebase `%s` onto upstream `%s` and hit a conflict.\n\n' "${PATCH_BRANCH}" "${t}"
                printf 'Run: %s/%s/actions/runs/%s\n\n' "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
                printf 'Resolve manually:\n\n'
                printf '```bash\n'
                printf 'git fetch origin && git fetch upstream --tags\n'
                printf 'git checkout %s\n' "${PATCH_BRANCH}"
                printf 'git rebase %s   # resolve conflicts, commit, continue\n' "${t}"
                printf 'git push --force-with-lease origin %s\n' "${PATCH_BRANCH}"
                printf 'git tag -a %s-%s -m "iOS 26 fixes on top of upstream %s"\n' "${t}" "${TAG_SUFFIX}" "${t}"
                printf 'git push origin %s-%s\n' "${t}" "${TAG_SUFFIX}"
                printf '```\n'
              } > "${body_file}"
              report_issue "${title}" "${body_file}" "automated,sync-conflict"
              exit 1
            fi

            # If the rebased patch branch is identical to upstream, the patches
            # are no longer needed. Notify and skip tagging — don't fail the run.
            ahead=$(git rev-list --count "${t}..HEAD")
            if [ "${ahead}" -eq 0 ]; then
              echo "::warning::Patches are no longer needed: ${PATCH_BRANCH} matches ${t} exactly. Consider retiring the fork."
              title="Patches no longer needed at ${t}"
              body_file="$(mktemp)"
              {
                printf '%s — fork may be ready to retire.\n\n' "${NOTIFY_HANDLE}"
                printf 'After rebasing `%s` onto upstream `%s`, the patch branch contains no commits beyond upstream.\n\n' "${PATCH_BRANCH}" "${t}"
                printf 'This typically means upstream merged equivalent fixes. Consider:\n'
                printf '1. Re-pointing SOSAFE-iOS `Package.swift` at `getsentry/SnapshotPreviews` directly.\n'
                printf '2. Archiving this fork.\n'
              } > "${body_file}"
              report_issue "${title}" "${body_file}" "automated,fork-retirement"
              echo "::endgroup::"
              continue
            fi

            git push --force-with-lease origin "${PATCH_BRANCH}"
            fork_tag="${t}-${TAG_SUFFIX}"
            git tag -a "${fork_tag}" -m "iOS 26 fixes on top of upstream ${t}"
            git push origin "${fork_tag}"
            echo "Tagged ${fork_tag}"
            echo "::endgroup::"
          done <<< "${NEW_TAGS}"
